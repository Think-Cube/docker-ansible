---
- name: Smoke test the image
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Assert the play runs as a non-root user
      ansible.builtin.assert:
        that:
          - ansible_facts['user_uid'] != 0

    - name: Assert jmespath-backed filters work
      ansible.builtin.assert:
        that:
          - "([{'name': 'a'}] | community.general.json_query('[0].name')) == 'a'"
